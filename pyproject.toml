[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-workflow-capture"
version = "1.0.0"
description = "Privacy-first capture of confirmed human-AI work processes"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "enterprise-ai-workflow-capture contributors"}]
dependencies = []

[project.scripts]
flow-capture = "workflow_capture.cli:main"

[tool.setuptools]
packages = ["workflow_capture"]

